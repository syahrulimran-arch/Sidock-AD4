[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sidock-ad4"
version = "0.7.9"
description = "A guided Windows GUI for AutoGrid4, AutoDock4, and optional AutoDock-GPU virtual screening"
authors = [{name = "Dr Syahrul Imran"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
  "rdkit>=2023.9",
  "meeko>=0.6",
  "scipy>=1.10",
  "gemmi>=0.6",
  "plip>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sidock = "sidock.app:main"

[tool.setuptools.packages.find]
include = ["sidock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
