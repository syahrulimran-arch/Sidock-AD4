name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: sidock-build
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict

      - name: Install scientific and build dependencies
        run: |
          conda install -y -c conda-forge rdkit pyside6 numpy scipy gemmi openbabel "plip>=3,<4" lxml pytest pyinstaller pyinstaller-hooks-contrib pip
          python -m pip install --disable-pip-version-check "meeko>=0.6,<0.8"
          python -m pip install --disable-pip-version-check --no-deps .

      - name: Run tests
        run: python -m pytest -q

      - name: Freeze application
        run: |
          pyinstaller --noconfirm --clean --distpath dist --workpath .build/pyinstaller packaging/SIDock.spec
          Copy-Item -Force "$env:CONDA_PREFIX\Library\bin\*.dll" "dist\SIDock\_internal\"
          # Keep one Open Babel core DLL. If _internal and the private tool
          # directory each contain a copy, the Python binding and .obf modules
          # register against different library instances and PLIP sees no
          # formats even though the external obabel.exe works.
          Remove-Item "dist\SIDock\_internal\openbabel-3.dll" -Force -ErrorAction Stop
          $pluginDir = "dist\SIDock\_internal\tools\openbabel"
          $plugins = @(Get-ChildItem $pluginDir -Filter "*.obf" -File -ErrorAction Stop)
          if ($plugins.Count -eq 0) { throw "No packaged Open Babel .obf plugins were found" }
          Write-Host "Packaged Open Babel plugins: $($plugins.Count)"
          python packaging/pe_dependencies.py "dist\SIDock"
          # Reproduce a normal installed PC. The activated Conda environment
          # previously supplied missing DLLs and could make a broken package
          # pass its runtime self-test.
          $internal = (Resolve-Path "dist\SIDock\_internal").Path
          $openBabelRoot = Join-Path $internal "tools\openbabel"
          $env:BABEL_LIBDIR = (Resolve-Path $pluginDir).Path + "\"
          $env:BABEL_DATADIR = (Resolve-Path (Join-Path $openBabelRoot "data")).Path + "\"
          $env:PYTHONPATH = ""
          $env:CONDA_PREFIX = ""
          $env:PATH = "$openBabelRoot;$internal;$env:SystemRoot\System32;$env:SystemRoot"

          $requiredData = @("space-groups.txt", "atomtyp.txt", "bondtyp.txt", "element.txt", "types.txt")
          foreach ($dataFile in $requiredData) {
            $dataPath = Join-Path $env:BABEL_DATADIR $dataFile
            if (-not (Test-Path $dataPath -PathType Leaf)) {
              throw "Required packaged Open Babel data file is missing: $dataPath"
            }
          }

          $formatOutput = & (Join-Path $openBabelRoot "obabel.exe") -L formats 2>&1
          $formatExit = $LASTEXITCODE
          $formatOutput | Write-Host
          if ($formatExit -ne 0 -or -not ($formatOutput -match "(?m)^pdb\s+--") -or -not ($formatOutput -match "(?m)^pdbqt\s+--")) {
            $dumpbin = Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio\2022" -Filter "dumpbin.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($dumpbin) {
              & $dumpbin.FullName /dependents (Join-Path $pluginDir "formats_common.obf")
            }
            throw "Packaged obabel cannot load its PDB/PDBQT plugins"
          }

          # Listing formats does not initialize Open Babel's chemistry data.
          # Perform the exact conversion class used for treated receptors and
          # reject the zero-molecule false success that escaped v0.7.9.
          $probePdb = Join-Path $PWD ".build\openbabel-probe.pdb"
          $probePdbqt = Join-Path $PWD ".build\openbabel-probe.pdbqt"
          @'
          ATOM      1  N   ALA A   1      11.104  13.207   9.447  1.00 20.00           N
          ATOM      2  CA  ALA A   1      12.560  13.330   9.280  1.00 20.00           C
          ATOM      3  C   ALA A   1      13.151  12.027   8.748  1.00 20.00           C
          ATOM      4  O   ALA A   1      12.558  10.963   8.918  1.00 20.00           O
          END
          '@ | Set-Content -Path $probePdb -Encoding ascii
          $conversionOutput = & (Join-Path $openBabelRoot "obabel.exe") -ipdb $probePdb -opdbqt -O $probePdbqt -h --partialcharge gasteiger -xr -xc -xn -xh 2>&1
          $conversionExit = $LASTEXITCODE
          $conversionOutput | Write-Host
          $probeText = if (Test-Path $probePdbqt) { Get-Content $probePdbqt -Raw } else { "" }
          if ($conversionExit -ne 0 -or $conversionOutput -match "0 molecules converted|Cannot initialize database" -or $probeText -notmatch "(?m)^(ATOM|HETATM)") {
            throw "Packaged obabel failed a real PDB-to-PDBQT conversion"
          }

          $selfTestOut = Join-Path $PWD ".build\sidock-self-test.out"
          $selfTestErr = Join-Path $PWD ".build\sidock-self-test.err"
          $process = Start-Process -FilePath "dist\SIDock\SIDock.exe" -ArgumentList "--self-test" -Wait -PassThru -RedirectStandardOutput $selfTestOut -RedirectStandardError $selfTestErr
          if (Test-Path $selfTestOut) { Get-Content $selfTestOut }
          if (Test-Path $selfTestErr) { Get-Content $selfTestErr }
          if ($process.ExitCode -ne 0) { throw "Packaged runtime self-test failed with exit code $($process.ExitCode)" }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile Setup EXE
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer\SIDock.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SIDock_AD4_Setup_v0.7.10
          path: dist/installer/SIDock_AD4_Setup_v0.7.10.exe
          if-no-files-found: error
